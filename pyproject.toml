[project]
name = "py.draw.io"
version = "0.1.2"
description = "Allows for the creation, manipulation and export of draw.io diagrams in python"
authors = [
    { name = "Johannes Grothe", email = "johannesgrothe@proton.me" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer (>=0.25.0,<0.26.0)",
    "beautifulsoup4 (>=4.14.2,<5.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "pydantic (>=2.13.0,<3.0.0)"
]

packages = [
    { include = "py_draw_io", from = "src" }
]

include = ["src/py_draw_io/py.typed"]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]

#[tool.poetry]
#package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-coverage (>=0.0,<0.1)",
    "mypy (>=2.0.0,<3.0.0)",
    "ruff (>=0.15.6,<0.16.0)"
]

[tool.mypy]
strict = true

[tool.flake8]
max-line-length = 120
#docstring-convention = "sphinx"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# https://github.com/astral-sh/ruff/issues/6606
select = ["E", "F", "D"]
#select = ["E", "F"]
ignore = ["D212", "D105", "D203"]

[tool.ruff.lint.pydocstyle]
#convention = "pep257"
