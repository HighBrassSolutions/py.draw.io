[project]
name = "py.draw.io"
version = "0.1.4"
description = "Allows for the creation, manipulation and export of draw.io diagrams in python"
authors = [
    { name = "Johannes Grothe", email = "johannesgrothe@proton.me" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer (>=0.25.0,<0.26.0)",
    "beautifulsoup4 (>=4.14.2,<5.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "pydantic (>=2.13.0,<3.0.0)"
]

packages = [
    { include = "py_draw_io", from = "src" }
]

include = ["src/py_draw_io/py.typed"]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]

#[tool.poetry]
#package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-coverage (>=0.0,<0.1)",
    "mypy (>=2.0.0,<3.0.0)",
    "ruff (>=0.15.6,<0.16.0)"
]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# https://github.com/astral-sh/ruff/issues/6606
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "D", # pydocstyle
    "I", # isort
    "N", # pep8-naming
    "A", # builtin shadowing
    "B", # bugbear
    "C4", # comprehensions
    "SIM", # simplify
    "COM", # trailing comma
    "ISC", # implicit str concat
    "Q", # quotes
    "TID", # tidy imports
    "PIE", # misc lints
    "W", # pycodestyle warnings
    "FA", # future-annotations
    "T20", # print statements
    "RET", # return statements
    "ARG", # unused arguments
    "PERF", # performance
    "RUF", # ruff-specific rules
    "G", # logging format
    "ERA", # commented-out code
    "UP", # pyupgrade
    "INP", # implicit namespace package
    "S", # flake8-bandit (security)
    "PTH", # use pathlib instead of os.path
    "ANN", # type annotations
    "TRY", # tryceratops (exception handling)
]

ignore = [
    "D212",
    "D105",
    "D203",
    "TRY003", # XmlDecodingError etc. are general-purpose with genuinely distinct per-site messages;
    # moving them into __init__ would be a no-op, not a real fix.
]

[tool.ruff.lint.per-file-ignores]
# Fixtures are injected by name; leaving one unused (e.g. to just get a temp dir) is normal in tests.
# `assert` is the standard pytest idiom, not a security concern.
# Test functions aren't type-annotated in this project (mypy doesn't check test/ either).
"test/**/*.py" = ["ARG001", "S101", "ANN"]

[tool.ruff.lint.pydocstyle]
#convention = "pep257"
