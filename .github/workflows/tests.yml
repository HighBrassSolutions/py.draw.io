name: Tests

on: [ pull_request ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Poetry
        run: |
          pip install poetry
          poetry install

      - name: Run Unit Tests
        run: poetry run pytest --log-cli-level=INFO --junit-xml=artifacts/unit_tests.xml

  type-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Poetry
        run: |
          pip install poetry
          poetry install

      - name: Run mypy type-checks
        run: poetry run mypy src/py_draw_io --txt-report=artifacts

      - name: Show Report
        run: cat artifacts/index.txt

      - name: Check precision
        run: |
          imprecise=$(grep "Total" artifacts/index.txt | awk '{print $4}' | tr -d '%')
          if (( $(echo "$imprecise > 0" | bc -l) )); then
            echo "Mypy coverage is not 100% (imprecise: $imprecise%)"
            exit 1
          fi

  code-style-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Poetry
        run: |
          pip install poetry
          poetry install

      - name: Run flake8 code-style-checks
        run: poetry run flake8 src/py_draw_io
