name: Tests

on: [ pull_request ]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Poetry
        run: |
          pip install poetry
          poetry install

      - name: Run Unit Tests
        run: poetry run pytest --log-cli-level=INFO --junit-xml=artifacts/unit_tests.xml
