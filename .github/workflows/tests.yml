name: Tests

on: [ pull_request ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Poetry
        run: |
          pip install poetry
          poetry install

      - name: Run Unit Tests
        run: poetry run pytest --log-cli-level=INFO --junit-xml=artifacts/unit_tests.xml

  mypy-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Poetry
        run: |
          pip install poetry
          poetry install

      - name: Run Unit Tests
        run: poetry run mypy src/py_draw_io --xml-report=artifacts/mypy.xml
